name: Aurora CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Queue every commit for this branch instead of cancelling an in-progress run.
# Each run checks out its own immutable commit SHA.
concurrency:
  group: aurora-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Install and build Aurora
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

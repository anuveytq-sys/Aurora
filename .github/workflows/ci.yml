name: Aurora CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Give every immutable commit its own run group. GitHub keeps only one pending
# run per concurrency group, so a branch-only group can replace older pending
# commits even when cancel-in-progress is false.
concurrency:
  group: aurora-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Install and build Aurora
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build
